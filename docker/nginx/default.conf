server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------
    # Segurança
    # ---------------------------------------------------------------------
    # Não anunciar a versão do Nginx: é informação que só serve a quem
    # procura vulnerabilidades conhecidas da versão.
    server_tokens off;

    include /etc/nginx/security-headers.conf;

    client_max_body_size 10m;

    # Compressão do que de fato se beneficia dela. Imagens e fontes já são
    # comprimidas e recomprimi-las só gasta CPU.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------------------------------------------------------------------
    # API
    # ---------------------------------------------------------------------
    # Os três prefixos do backend. `/sanctum` emite o cookie de CSRF e fica
    # fora de `/api` — esquecê-lo faz o login falhar com 419, porque o
    # navegador nunca recebe o token.
    location ~ ^/(api|sanctum|up) {
        # 30 requisições por segundo com rajada de 60, sem atraso artificial
        # nas primeiras. É folgado para uso humano — a interface agrupa a
        # digitação antes de buscar — e corta a enxurrada automatizada antes
        # de o PHP ser acionado.
        limit_req zone=api_limit burst=60 nodelay;
        limit_conn api_conn 20;

        try_files $uri /index.php?$query_string;
    }

    location = /index.php {
        # O caminho é o do sistema de arquivos do container do PHP, não
        # deste; o diretório da aplicação é montado nos dois.
        fastcgi_pass app:9000;
        fastcgi_index index.php;

        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;

        # Requisições longas não devem ser cortadas no meio.
        fastcgi_read_timeout 60s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    # Nenhum outro .php é servido. Sem esta regra, um arquivo PHP que
    # chegasse ao diretório público poderia ser executado.
    location ~ \.php$ {
        return 404;
    }

    # ---------------------------------------------------------------------
    # SPA
    # ---------------------------------------------------------------------
    # Os arquivos do build trazem hash no nome, então podem ser guardados
    # em cache indefinidamente: uma nova versão tem outro nome.
    location /assets/ {
        include /etc/nginx/security-headers.conf;

        # Um único Cache-Control, em vez de `expires` somado a um
        # `add_header`: as duas diretivas juntas emitem dois cabeçalhos
        # Cache-Control na mesma resposta.
        add_header Cache-Control "public, max-age=31536000, immutable" always;

        try_files $uri =404;
    }

    # O index.html NÃO pode ser cacheado: é ele que aponta para os arquivos
    # com hash, e um index antigo em cache manteria o usuário numa versão
    # anterior indefinidamente.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Qualquer outra rota cai no SPA, que tem roteamento próprio. Sem isto,
    # recarregar a página em /login devolveria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos ocultos nunca são servidos.
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
