# Limite de requisições por endereço de origem.
#
# Complementa o limite da aplicação, que o Laravel aplica por usuário depois
# da autenticação. Requisição sem sessão recebe 401 antes de chegar ao
# limitador do PHP, de modo que tráfego anônimo em enxurrada ficaria sem
# qualquer limite — barrá-lo aqui custa muito menos do que iniciar o PHP para
# depois recusar.
#
# `$binary_remote_addr` ocupa 4 bytes por IPv4, contra 15 da forma textual:
# 10 MB guardam cerca de 160 mil endereços distintos.
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

# Resposta do limite. O padrão do Nginx é 503, que sugere falha do servidor;
# 429 diz ao cliente o que de fato aconteceu.
limit_req_status 429;

# Conexões simultâneas por origem, contra o esgotamento de conexões por um
# único cliente.
limit_conn_zone $binary_remote_addr zone=api_conn:10m;
limit_conn_status 429;
