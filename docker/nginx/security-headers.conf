# Cabeçalhos de segurança aplicados a toda resposta.
#
# Ficam num arquivo à parte por causa de uma regra do Nginx que é fácil de
# errar: diretivas `add_header` de um nível só são herdadas pelo nível
# interno se esse nível NÃO declarar nenhum `add_header` próprio. Um único
# `add_header Cache-Control` dentro de um `location` descarta, em silêncio,
# todos os cabeçalhos de segurança definidos no `server`.
#
# Foi o que aconteceu: as respostas da API vinham com os quatro cabeçalhos,
# mas a página HTML — justamente a que precisa de proteção contra
# clickjacking — vinha sem nenhum, porque o `location` dela define o próprio
# Cache-Control. Incluir este arquivo em cada bloco que declara `add_header`
# é o que mantém o conjunto completo em todas as respostas.

# Impede que a página seja embutida num iframe de outro site, que é o vetor
# de clickjacking.
add_header X-Frame-Options "SAMEORIGIN" always;

# Impede o navegador de adivinhar o tipo de um arquivo pelo conteúdo, o que
# permitiria tratar um arquivo enviado como script.
add_header X-Content-Type-Options "nosniff" always;

# Não envia a URL completa como referência a sites externos; uma URL pode
# conter identificadores que não devem vazar.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# A aplicação não usa câmera, microfone nem geolocalização.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Content-Security-Policy — a defesa que mais limita o estrago de um XSS.
#
# Os demais cabeçalhos acima tratam de enquadramento, adivinhação de tipo e
# vazamento de referência. Este trata do pior caso: se um script estranho
# chegar à página, de onde ele pode carregar código e para onde pode mandar
# dado. Sem CSP, a resposta é "de qualquer lugar, para qualquer lugar".
#
# A política é restritiva porque o build permite: o HTML gerado pelo Vite não
# tem script nem estilo embutido, e a aplicação não carrega nada de CDN.
#
#   default-src 'self'      nada vem de fora, salvo o liberado adiante
#   script-src 'self'       só scripts servidos por esta origem; sem inline,
#                           que é o vetor clássico de XSS refletido
#   style-src 'unsafe-inline'  necessário, e verificado: o Vuetify aplica
#                           estilo embutido para posicionar overlays, menus e
#                           transições. Sem isso o layout quebra — foi medido,
#                           não suposto. O risco é bem menor que no caso de
#                           script: a exfiltração de dado por CSS depende de
#                           carregar recurso externo, e `img-src 'self' data:`
#                           já bloqueia esse caminho. Nenhuma exceção foi
#                           aberta para script, que é o que de fato importa
#   connect-src             a própria origem e o ViaCEP, único serviço externo
#   img-src data:           o Vuetify usa imagens embutidas em data URI
#   frame-ancestors 'none'  equivale a X-Frame-Options, na forma moderna
#   object-src 'none'       sem Flash, applets ou plugins
#   base-uri 'self'         impede <base> apontar scripts relativos para fora
#   form-action 'self'      impede envio de formulário para outro domínio
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://viacep.com.br; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
