; Opcache: compila o bytecode uma vez em vez de a cada requisição.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=128
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000

; `validate_timestamps=0` dispensa a verificação de data dos arquivos a cada
; requisição, válido porque o código é imutável dentro da imagem. Exige
; reiniciar o container para que uma alteração tenha efeito — é a troca
; correta para um ambiente que se reconstrói, e errada para desenvolvimento
; com volume montado.
opcache.validate_timestamps=0
