; Limites de upload e memória compatíveis com uma API de formulários.
memory_limit=256M
upload_max_filesize=8M
post_max_size=10M
max_execution_time=30

; Não anunciar a versão do PHP no cabeçalho da resposta: é informação que
; só ajuda quem procura vulnerabilidades conhecidas da versão.
expose_php=0

; Erros vão para o log do container, nunca para o corpo da resposta.
display_errors=0
display_startup_errors=0
log_errors=1
error_log=/dev/stderr
